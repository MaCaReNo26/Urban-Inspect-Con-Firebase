<ion-content class="ion-padding">

  <div class="login-container">

    <div class="login-header">
      <h1>UrbanInspect</h1>
      <p>Sistema de inspección urbana</p>
    </div>

    <ion-card>
      <ion-card-header>
        <ion-card-title>Iniciar sesión</ion-card-title>
        <p>Ingrese sus credenciales para continuar.</p>
      </ion-card-header>

      <ion-card-content>

        <ion-item>
          <ion-input
            label="Correo electrónico"
            labelPlacement="floating"
            type="email"
            [(ngModel)]="email"
            placeholder="usuario@correo.com">
          </ion-input>
        </ion-item>

        <ion-item>
          <ion-input
            label="Contraseña"
            labelPlacement="floating"
            type="password"
            [(ngModel)]="password"
            placeholder="Ingrese su contraseña">
          </ion-input>
        </ion-item>

        <ion-text color="danger" *ngIf="mensaje">
          <p>{{ mensaje }}</p>
        </ion-text>

        <ion-button
          expand="block"
          class="login-button"
          (click)="iniciarSesion()"
          [disabled]="cargando">

          {{ cargando ? 'Ingresando...' : 'Iniciar sesión' }}

        </ion-button>

        <div class="register-link">
          <p>¿No tienes una cuenta?</p>

          <ion-button
            fill="clear"
            routerLink="/register">
            Registrarse
          </ion-button>
        </div>

      </ion-card-content>
    </ion-card>

  </div>

</ion-content>
